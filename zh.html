<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SparkOrg · 服务入口</title>
<style>
  :root{
    --bg:#0f1117; --card:#181b23; --text:#e8eaed; --muted:#9aa0aa;
    --line:#2a2e38; --primary:#3b82f6; --primary-soft:rgba(59,130,246,.12);
    --warn:#f59e0b; --warn-soft:rgba(245,158,11,.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(15,17,23,.9);
    backdrop-filter:blur(8px); z-index:10;
  }
  header .brand{font-size:15px; letter-spacing:1px; font-weight:600;}
  header .brand span{color:var(--primary);}
  .lang-switch{display:flex; gap:8px; font-size:13px;}
  .lang-switch a{
    color:var(--muted); text-decoration:none; padding:4px 10px;
    border-radius:6px; border:1px solid var(--line);
  }
  .lang-switch a.active{color:#fff; background:var(--primary); border-color:var(--primary);}
  .lang-switch a:not(.active):hover{color:var(--text); border-color:var(--primary);}

  main{max-width:760px; margin:0 auto; padding:32px 20px 60px;}
  .page-title{font-size:20px; margin:0 0 4px;}
  .page-sub{font-size:13px; color:var(--muted); margin:0 0 28px;}

  .service-card{
    background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:24px; margin-bottom:20px;
  }
  .service-card.primary{
    border-color:var(--primary);
    box-shadow:0 0 0 1px var(--primary-soft) inset;
  }
  .service-top{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:14px;
  }
  .tag{
    display:inline-block; font-size:11px; letter-spacing:1px;
    padding:3px 9px; border-radius:999px;
  }
  .tag.main{color:var(--primary); background:var(--primary-soft);}
  .tag.service{color:var(--muted); background:rgba(154,160,170,.12);}
  .key{
    font-size:11px; color:var(--muted); letter-spacing:1.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .service-domain{
    font-size:26px; font-weight:600; word-break:break-all;
    margin:0 0 10px; letter-spacing:.3px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .service-card.primary .service-domain{font-size:30px; color:var(--primary);}
  .service-desc{font-size:14px; color:var(--muted); line-height:1.7; margin:0 0 18px;}
  .visit{
    display:inline-flex; align-items:center; gap:6px; font-size:14px;
    color:#fff; background:var(--primary); text-decoration:none;
    padding:9px 16px; border-radius:9px; transition:opacity .15s;
  }
  .visit:hover{opacity:.88;}
  .visit.ghost{background:transparent; color:var(--primary); border:1px solid var(--primary);}
  .visit.ghost:hover{background:var(--primary-soft); opacity:1;}
  .loading{color:var(--muted); font-size:14px;}
  .disabled-note{
    margin-top:8px; font-size:12px; color:var(--muted);
    border-left:3px solid var(--line); padding-left:12px;
  }

  .api-card{
    margin-top:24px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:18px 22px;
  }
  .api-card .api-title{
    font-size:12px; letter-spacing:1px; text-transform:uppercase;
    color:var(--muted); margin-bottom:10px;
  }
  .api-card .api-links{display:flex; flex-direction:column;}
  .api-card .api-links a{
    color:var(--primary); text-decoration:none; font-size:14px;
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    word-break:break-all;
  }
  .api-card .api-links a + a{border-top:1px dashed var(--line);}
  .api-card .api-links a:hover{opacity:.85;}
  .api-card .api-links a .desc{
    flex-shrink:0; margin-left:10px; color:var(--muted); font-size:12px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
</style>
</head>
<body>

<header>
  <div class="brand">Spark<span>Org</span></div>
  <nav class="lang-switch">
    <a href="zh.html" class="active">中文</a>
    <a href="en.html">English</a>
    <a href="docs.zh.html">API</a>
  </nav>
</header>

<main>
  <h1 class="page-title">服务入口</h1>
  <p class="page-sub">以下为 SparkOrg 提供的服务域名，配置来自 services.toml</p>
  <div id="cards"><p class="loading">加载中…</p></div>

  <section class="api-card">
    <div class="api-title">接口 · API</div>
    <div class="api-links">
      <a href="docs.zh.html"><span>接口文档</span><span class="desc">API Docs →</span></a>
      <a href="go.html"><span>跳转主页</span><span class="desc">Go to HOME →</span></a>
      <a href="api/services.json"><span>api/services.json</span><span class="desc">全部服务 · JSON</span></a>
      <a href="api/services.toml"><span>api/services.toml</span><span class="desc">全部服务 · TOML</span></a>
      <a href="api/services.txt"><span>api/services.txt</span><span class="desc">KEY=域名 · 纯文本</span></a>
      <a href="api/home.txt"><span>api/home.txt</span><span class="desc">主页域名 · 纯文本</span></a>
    </div>
  </section>
</main>

<script>
/* ===== 服务配置读取（读取生成后的 api/services.json） ===== */
var DEFAULT_DATA = {
  home: 'HOME',
  home_domain: 'sparkorg.dpdns.org',
  services: { HOME: 'sparkorg.dpdns.org' },
  labels: {
    HOME: { zh: '主页', en: 'Home', desc_zh: 'SparkOrg 主站入口', desc_en: 'SparkOrg main site' }
  },
  disabled: []
};

function loadServices(cb){
  if(!window.fetch){ cb(DEFAULT_DATA); return; }
  fetch('api/services.json', { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(data){ cb(data); })
    .catch(function(){ cb(DEFAULT_DATA); });
}

function metaFor(data, key){
  return (data.labels && data.labels[key]) || { zh: key, en: key, desc_zh: '', desc_en: '' };
}
/* ===== 服务配置读取结束 ===== */

function buildCard(data, key){
  var meta = metaFor(data, key);
  var isHome = key === data.home;
  var tag = isHome ? '主页 · 推荐使用' : (meta.zh + ' · ' + meta.en);
  var kind = isHome ? 'main' : 'service';
  var desc = meta.desc_zh || '服务域名';
  var btn = isHome ? '访问主页 →' : '访问服务 →';
  var cls = isHome ? 'visit' : 'visit ghost';
  var domain = data.services[key];
  return '<section class="service-card' + (isHome ? ' primary' : '') + '">'
       +   '<div class="service-top">'
       +     '<span class="tag ' + kind + '">' + tag + '</span>'
       +     '<span class="key">' + key + '</span>'
       +   '</div>'
       +   '<h2 class="service-domain">' + domain + '</h2>'
       +   '<p class="service-desc">' + desc + '</p>'
       +   '<a class="' + cls + '" href="https://' + domain + '" target="_blank" rel="noopener">' + btn + '</a>'
       + '</section>';
}

loadServices(function(data){
  var html = '';
  Object.keys(data.services || {}).forEach(function(key){
    html += buildCard(data, key);
  });
  if((data.disabled || []).length){
    html += '<p class="disabled-note">未配置：' + data.disabled.join(', ') + '</p>';
  }
  document.getElementById('cards').innerHTML = html || '<p class="loading">未配置服务</p>';
});

/* 记录语言偏好 */
localStorage.setItem('lang', 'zh');
</script>

</body>
</html>
