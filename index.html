<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SparkOrg · 选择语言 / Select Language</title>
<style>
  :root{
    --bg:#0f1117; --card:#181b23; --text:#e8eaed; --muted:#9aa0aa;
    --line:#2a2e38; --primary:#3b82f6; --primary-soft:rgba(59,130,246,.15);
    --warn:#f59e0b; --warn-soft:rgba(245,158,11,.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{width:100%; max-width:460px; text-align:center;}
  .logo{font-size:13px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:10px;}
  h1{font-size:24px; margin:0 0 6px;}
  .sub{font-size:14px; color:var(--muted); margin:0 0 24px;}
  .langs{display:flex; flex-direction:column; gap:12px; margin-bottom:28px;}
  .lang-btn{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; color:var(--text); text-decoration:none; font-size:16px;
    transition:border-color .15s, background .15s;
  }
  .lang-btn:hover{border-color:var(--primary); background:var(--primary-soft);}
  .lang-btn .code{font-size:12px; color:var(--muted); letter-spacing:1px;}
  .preview{
    text-align:left; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:16px 18px; font-size:13px;
  }
  .preview-title{
    color:var(--muted); font-size:12px; letter-spacing:1px;
    text-transform:uppercase; margin-bottom:10px;
  }
  .preview .dom{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:7px 0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    word-break:break-all;
  }
  .preview .dom + .dom{border-top:1px dashed var(--line);}
  .preview .dom .role{
    flex-shrink:0; font-size:11px; padding:2px 8px; border-radius:999px;
  }
  .role.main{color:var(--primary); background:var(--primary-soft);}
  .role.service{color:var(--muted); background:rgba(154,160,170,.12);}
  .preview .empty{
    margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);
    font-size:11px; color:var(--muted);
  }
  .tip{margin-top:20px; font-size:12px; color:var(--muted); line-height:1.6;}
  .tip a{color:var(--primary);}
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">SparkOrg</div>
  <h1>选择语言 / Select Language</h1>
  <p class="sub">请选择你要查看的语言 · Choose your language</p>

  <div class="langs">
    <a class="lang-btn" href="zh.html"><span>中文</span><span class="code">ZH</span></a>
    <a class="lang-btn" href="en.html"><span>English</span><span class="code">EN</span></a>
  </div>

  <div class="preview">
    <div class="preview-title">当前服务 · Services</div>
    <div id="services">加载中… / Loading…</div>
  </div>

  <p class="tip">
    如果页面没有自动跳转，请手动点击上面的语言。<br>
    If the page didn't redirect automatically, please pick a language above.
  </p>

  <p class="tip">
    <a href="docs.html">API 文档 / API Docs</a> ·
    <a href="go.html">跳转主页 / Go to home</a>
  </p>
</div>

<script>
/* ===== 服务配置读取（读取生成后的 api/services.json） ===== */
var DEFAULT_DATA = {
  home: 'HOME',
  home_domain: 'sparkorg.dpdns.org',
  services: { HOME: 'sparkorg.dpdns.org' },
  labels: {
    HOME: { zh: '主页', en: 'Home', desc_zh: 'SparkOrg 主站入口', desc_en: 'SparkOrg main site' }
  },
  disabled: []
};

function loadServices(cb){
  if(!window.fetch){ cb(DEFAULT_DATA); return; }
  fetch('api/services.json', { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(data){ cb(data); })
    .catch(function(){ cb(DEFAULT_DATA); });
}

function metaFor(data, key){
  return (data.labels && data.labels[key]) || { zh: key, en: key, desc_zh: '', desc_en: '' };
}
/* ===== 服务配置读取结束 ===== */

loadServices(function(data){
  var html = '';
  Object.keys(data.services || {}).forEach(function(key){
    var meta = metaFor(data, key);
    var isHome = key === data.home;
    html += '<div class="dom"><span>' + data.services[key] + '</span>'
          + '<span class="role ' + (isHome ? 'main' : 'service') + '">'
          + (isHome ? '主 / Main' : (meta.zh + ' / ' + meta.en))
          + '</span></div>';
  });
  if((data.disabled || []).length){
    html += '<div class="empty">未配置 / Not configured：' + data.disabled.join(', ') + '</div>';
  }
  document.getElementById('services').innerHTML = html || '（未配置服务）';
});

/* 语言识别 + 跳转 */
(function () {
  var saved = localStorage.getItem('lang');
  if (saved === 'zh' || saved === 'en') {
    location.replace(saved + '.html');
    return;
  }
  var lang = (navigator.language || navigator.userLanguage || 'zh').toLowerCase();
  location.replace(lang.indexOf('zh') === 0 ? 'zh.html' : 'en.html');
})();
</script>

</body>
</html>
