# ============================================
# SparkOrg · 服务域名配置 / Service domains
# ============================================
# 一个变量 = 一个服务 = 一个域名。
# 值留空表示该服务未配置，不会出现在接口和页面中。
# 新增服务只需在 [services] 里加一行，例如：
#   BLOG = "blog.example.com"
# ============================================

[services]
HOME = "sparkorg.dpdns.org"
FORUM = "forum.sparkorg.dpdns.org"
GIT = "git.sparkorg.dpdns.org"
STATUS = "status.sparkorg.dpdns.org"
CLOUD_ST = "cloud.sparkorg.dpdns.org"
FDROID = "fdroid.sparkorg.dpdns.org"

# --------------------------------------------
# 可选：显示名称与说明
# 未配置的项会自动使用变量名作为兜底
# --------------------------------------------

[labels.HOME]
zh = "主页"
en = "Home"
desc_zh = "SparkOrg 主站入口"
desc_en = "SparkOrg main site"

[labels.FORUM]
zh = "论坛"
en = "Forum"
desc_zh = "社区交流与讨论"
desc_en = "Community discussion forum"

[labels.GIT]
zh = "Git 服务"
en = "Git"
desc_zh = "代码托管与仓库服务"
desc_en = "Source code hosting service"

[labels.STATUS]
zh = "状态页"
en = "Status"
desc_zh = "各服务的运行状态与公告"
desc_en = "Service status and announcements"

[labels.CLOUD_ST]
zh = "云服务"
en = "Cloud"
desc_zh = "云平台"
desc_en = "Nextcloud"

[labels.CLOUD_ST]
zh = "Fdroid 镜像源"
en = "Fdroid Source"
desc_zh = "发布组织的Android开源应用程序和我们找到的其他好用开源Android应用程序(不定时更新,不过可以发邮件提醒更新)"
desc_en = "Open-source Android apps released by our organization and other useful open-source Android apps we've found (updated irregularly; email us to be reminded about updates)"
