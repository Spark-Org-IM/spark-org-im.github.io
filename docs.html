<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SparkOrg · 接口文档 / API Documentation</title>
<style>
  :root{
    --bg:#0f1117; --card:#181b23; --text:#e8eaed; --muted:#9aa0aa;
    --line:#2a2e38; --primary:#3b82f6; --primary-soft:rgba(59,130,246,.15);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{width:100%; max-width:460px; text-align:center;}
  .logo{font-size:13px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:10px;}
  h1{font-size:24px; margin:0 0 6px;}
  .sub{font-size:14px; color:var(--muted); margin:0 0 24px;}
  .langs{display:flex; flex-direction:column; gap:12px; margin-bottom:28px;}
  .lang-btn{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; color:var(--text); text-decoration:none; font-size:16px;
    transition:border-color .15s, background .15s;
  }
  .lang-btn:hover{border-color:var(--primary); background:var(--primary-soft);}
  .lang-btn .code{font-size:12px; color:var(--muted); letter-spacing:1px;}
  .tip{font-size:12px; color:var(--muted); line-height:1.7;}
  .tip a{color:var(--primary);}
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">SparkOrg</div>
  <h1>接口文档 / API Documentation</h1>
  <p class="sub">请选择文档语言 · Choose your docs language</p>

  <div class="langs">
    <a class="lang-btn" href="docs.zh.html"><span>中文文档</span><span class="code">ZH</span></a>
    <a class="lang-btn" href="docs.en.html"><span>English Docs</span><span class="code">EN</span></a>
  </div>

  <p class="tip">
    将根据语言偏好自动跳转到对应语言的接口文档。<br>
    You'll be redirected to the docs in your preferred language.<br>
    <a href="zh.html">域名页 / Domains</a> · <a href="go.html">跳转主域名 / Go to primary</a>
  </p>
</div>

<script>
/* 根目录接口文档入口：按语言偏好跳转到对应语言文档
   (same pattern as index.html: saved preference first, then browser language) */
(function () {
  var saved = localStorage.getItem('lang');
  if (saved === 'zh' || saved === 'en') {
    location.replace('docs.' + saved + '.html');
    return;
  }
  var lang = (navigator.language || navigator.userLanguage || 'zh').toLowerCase();
  location.replace(lang.indexOf('zh') === 0 ? 'docs.zh.html' : 'docs.en.html');
})();
</script>

</body>
</html>
