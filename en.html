<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SparkOrg · Domain Service</title>
<style>
  :root{
    --bg:#0f1117; --card:#181b23; --text:#e8eaed; --muted:#9aa0aa;
    --line:#2a2e38; --primary:#3b82f6; --primary-soft:rgba(59,130,246,.12);
    --warn:#f59e0b; --warn-soft:rgba(245,158,11,.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(15,17,23,.9);
    backdrop-filter:blur(8px); z-index:10;
  }
  header .brand{font-size:15px; letter-spacing:1px; font-weight:600;}
  header .brand span{color:var(--primary);}
  .lang-switch{display:flex; gap:8px; font-size:13px;}
  .lang-switch a{
    color:var(--muted); text-decoration:none; padding:4px 10px;
    border-radius:6px; border:1px solid var(--line);
  }
  .lang-switch a.active{color:#fff; background:var(--primary); border-color:var(--primary);}
  .lang-switch a:not(.active):hover{color:var(--text); border-color:var(--primary);}

  main{max-width:760px; margin:0 auto; padding:32px 20px 60px;}
  .page-title{font-size:20px; margin:0 0 4px;}
  .page-sub{font-size:13px; color:var(--muted); margin:0 0 28px;}

  .domain-card{
    background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:24px; margin-bottom:20px;
  }
  .domain-card.primary{
    border-color:var(--primary);
    box-shadow:0 0 0 1px var(--primary-soft) inset;
  }
  .tag{
    display:inline-block; font-size:11px; letter-spacing:1px;
    padding:3px 9px; border-radius:999px; margin-bottom:14px;
    text-transform:uppercase;
  }
  .tag.main{color:var(--primary); background:var(--primary-soft);}
  .tag.other{color:var(--warn); background:var(--warn-soft);}
  .domain-name{
    font-size:26px; font-weight:600; word-break:break-all;
    margin:0 0 10px; letter-spacing:.3px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .domain-card.primary .domain-name{font-size:30px; color:var(--primary);}
  .domain-desc{font-size:14px; color:var(--muted); line-height:1.7; margin:0 0 18px;}
  .visit{
    display:inline-flex; align-items:center; gap:6px; font-size:14px;
    color:#fff; background:var(--primary); text-decoration:none;
    padding:9px 16px; border-radius:9px; transition:opacity .15s;
  }
  .visit:hover{opacity:.88;}
  .visit.ghost{background:transparent; color:var(--warn); border:1px solid var(--warn);}
  .visit.ghost:hover{background:var(--warn-soft); opacity:1;}
  .loading{color:var(--muted); font-size:14px;}

  .api-card{
    margin-top:24px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:18px 22px;
  }
  .api-card .api-title{
    font-size:12px; letter-spacing:1px; text-transform:uppercase;
    color:var(--muted); margin-bottom:10px;
  }
  .api-card .api-links{display:flex; flex-direction:column;}
  .api-card .api-links a{
    color:var(--primary); text-decoration:none; font-size:14px;
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    word-break:break-all;
  }
  .api-card .api-links a + a{border-top:1px dashed var(--line);}
  .api-card .api-links a:hover{opacity:.85;}
  .api-card .api-links a .desc{
    flex-shrink:0; margin-left:10px; color:var(--muted); font-size:12px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
</style>
</head>
<body>

<header>
  <div class="brand">Spark<span>Org</span></div>
  <nav class="lang-switch">
    <a href="zh.html">中文</a>
    <a href="en.html" class="active">English</a>
    <a href="docs.en.html">API</a>
  </nav>
</header>

<main>
  <h1 class="page-title">Domain Service</h1>
  <p class="page-sub">Available domains for this service</p>
  <div id="cards"><p class="loading">Loading…</p></div>

  <section class="api-card">
    <div class="api-title">API</div>
    <div class="api-links">
      <a href="docs.en.html"><span>API Docs</span><span class="desc">Documentation →</span></a>
      <a href="go.html"><span>Go to primary</span><span class="desc">Redirect →</span></a>
      <a href="api/domain.txt"><span>api/domain.txt</span><span class="desc">Raw primary · Plain text</span></a>
      <a href="api/domain.json"><span>api/domain.json</span><span class="desc">JSON · Bilingual labels</span></a>
      <a href="api/domain.yaml"><span>api/domain.yaml</span><span class="desc">YAML</span></a>
      <a href="api/domain.xml"><span>api/domain.xml</span><span class="desc">XML</span></a>
    </div>
  </section>
</main>

<script>
/* ===== 域名配置读取（三个页面共用同一段逻辑） ===== */
var DEFAULT_DOMAINS = { primary: ['sparkorg.dpdns.org'], others: ['sparkorg.cc.cd'] };

function parseDomains(text){
  var primary = [], others = [];
  text.split(/\r?\n/).forEach(function(line){
    line = line.trim();
    if(!line || line.charAt(0) === '#') return;
    var i = line.indexOf('=');
    if(i < 0) return;
    var key = line.slice(0, i).trim().toLowerCase();
    var val = line.slice(i + 1).trim();
    if(!val) return;
    if(key === 'primary') primary.push(val);
    else if(key === 'other') others.push(val);
  });
  if(!primary.length && !others.length) return DEFAULT_DOMAINS;
  return { primary: primary, others: others };
}

function loadDomains(cb){
  if(!window.fetch){ cb(DEFAULT_DOMAINS); return; }
  fetch('domain.txt')
    .then(function(r){ if(!r.ok) throw 0; return r.text(); })
    .then(function(t){ cb(parseDomains(t)); })
    .catch(function(){ cb(DEFAULT_DOMAINS); });
}
/* ===== 域名配置读取结束 ===== */

function buildCard(name, isPrimary){
  var tag  = isPrimary ? 'Primary · Recommended' : 'Other · Backup';
  var kind = isPrimary ? 'main' : 'other';
  var desc = isPrimary
    ? 'Main domain. May change.'
    : 'Backup domain. UNSTABLE.';
  var btn  = isPrimary ? 'Visit primary →' : 'Try it →';
  var cls  = isPrimary ? 'visit' : 'visit ghost';
  return '<section class="domain-card' + (isPrimary ? ' primary' : '') + '">'
       +   '<span class="tag ' + kind + '">' + tag + '</span>'
       +   '<h2 class="domain-name">' + name + '</h2>'
       +   '<p class="domain-desc">' + desc + '</p>'
       +   '<a class="' + cls + '" href="https://' + name + '" target="_blank" rel="noopener">' + btn + '</a>'
       + '</section>';
}

loadDomains(function(d){
  var html = '';
  d.primary.forEach(function(v){ html += buildCard(v, true);  });
  d.others .forEach(function(v){ html += buildCard(v, false); });
  document.getElementById('cards').innerHTML = html || '<p class="loading">No domains configured.</p>';
});

/* 记录语言偏好 */
localStorage.setItem('lang', 'en');
</script>

</body>
</html>
